<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심경희 | 1:1 맞춤 금융·보장 솔루션 파트너</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 pb-8">
    <!-- 상단 프로필 영역 -->
    <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white p-6 pt-10 text-center rounded-b-[2.5rem]">
      <div class="relative w-28 h-28 mx-auto mb-4">
        <!-- 프로필 이미지 경로 (public/profile.jpg 등) -->
        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=300" 
             alt="심경희 대표 프로필" 
             class="w-full h-full object-cover rounded-full border-4 border-white/20 shadow-md">
      </div>
      <h1 class="text-2xl font-bold tracking-tight">심경희</h1>
      <p class="text-xs uppercase tracking-widest text-emerald-400 font-semibold mt-1">Senior Financial & Insurance Advisor</p>
      
      <p class="mt-4 text-sm text-slate-200 leading-relaxed font-light px-2">
        "어려운 용어 대신 진심을 담아,<br>
        당신의 가장 평온한 일상을 지키는 평생 든든한 파트너가 되겠습니다."
      </p>
    </section>

    <!-- 핵심 전환 버튼 (CTA) -->
    <section class="p-6 space-y-3">
      <!-- 1순위: 1:1 상담 예약 -->
      <a href="https://forms.google.com" target="_blank" 
         class="flex items-center justify-between w-full p-4 bg-slate-900 text-white font-medium rounded-2xl shadow-lg hover:bg-slate-800 transition duration-200">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
            <i class="fa-regular fa-calendar-check"></i>
          </div>
          <div class="text-left">
            <span class="block text-sm font-semibold">1:1 맞춤 보장 상담 신청</span>
            <span class="block text-xs text-slate-400">데이터 기반 정밀 분석 예약</span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-slate-500 text-sm"></i>
      </a>

      <!-- 2순위: 카카오톡 문의 -->
      <a href="https://open.kakao.com" target="_blank" 
         class="flex items-center justify-between w-full p-4 bg-amber-400 text-slate-900 font-medium rounded-2xl shadow hover:bg-amber-300 transition duration-200">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-slate-900/10 flex items-center justify-center text-lg">
            <i class="fa-solid fa-comment"></i>
          </div>
          <div class="text-left">
            <span class="block text-sm font-bold">카카오톡 실시간 상담</span>
            <span class="block text-xs text-slate-700">궁금한 점 편하게 질문하기</span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-slate-600 text-sm"></i>
      </a>

      <!-- 3순위: 전화 연결 -->
      <a href="tel:010-0000-0000" 
         class="flex items-center justify-between w-full p-4 bg-white border border-slate-200 text-slate-800 font-medium rounded-2xl shadow-sm hover:bg-slate-50 transition duration-200">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div class="text-left">
            <span class="block text-sm font-semibold">직통 전화 연결</span>
            <span class="block text-xs text-slate-400">010-0000-0000</span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-slate-400 text-sm"></i>
      </a>
    </section>

    <!-- 신뢰 지표 & 정보 영역 -->
    <section class="px-6 py-2">
      <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">핵심 전문 영역</h2>
        <ul class="text-xs text-slate-600 space-y-1.5 leading-normal font-medium">
          <li class="flex items-center gap-2">
            <i class="fa-solid fa-check text-emerald-500"></i> 최신 의료 기술 및 신담보 정밀 분석
          </li>
          <li class="flex items-center gap-2">
            <i class="fa-solid fa-check text-emerald-500"></i> 생애주기 맞춤형 자산·보장 설계
          </li>
          <li class="flex items-center gap-2">
            <i class="fa-solid fa-check text-emerald-500"></i> 기존 보험 리모델링 및 과부족 진단
          </li>
        </ul>
      </div>
    </section>

    <!-- SNS 및 외부 링크 -->
    <section class="px-6 pt-3 flex justify-center gap-4 text-slate-400">
      <a href="#" class="p-3 bg-slate-50 rounded-full hover:text-slate-800 transition"><i class="fa-brands fa-blogger-b"></i></a>
      <a href="#" class="p-3 bg-slate-50 rounded-full hover:text-slate-800 transition"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="p-3 bg-slate-50 rounded-full hover:text-slate-800 transition"><i class="fa-brands fa-youtube"></i></a>
    </section>
  </main>

</body>
</html>
